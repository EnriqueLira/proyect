}

<br><br>

let grafica1;
let grafica2;

function buscarEstado(){
  let texto = document.getElementById("buscador").value.toLowerCase();
  if(texto.length < 3) return;

  for(let estado in estados){
    if(estado.toLowerCase().includes(texto)){
      mostrarEstado(estado);
      return;
    }
  }
}

function mostrarEstado(nombre){
  let estado = estados[nombre];

  document.getElementById("nombreEstado").innerHTML = nombre;

  let info = "<b>Capital:</b> "+estado.capital+
  "<br><b>Población:</b> "+estado.poblacion+
  "<br><b>Superficie:</b> "+estado.superficie+" km²"+
  "<br><b>Región:</b> "+estado.region+
  "<br><b>Minerales principales:</b> "+estado.minerales;

  // Agregar número de municipios si aplica
  if(nombre === "Quintana Roo") info += "<br><b>Número de municipios:</b> 11";
  if(nombre === "Tabasco") info += "<br><b>Número de municipios:</b> 17";

  document.getElementById("infoEstado").innerHTML = info;

  // Mostrar imagen
  let img = document.getElementById("imgEstado");
  img.src = estado.imagen;
  img.style.display = "block";

  if(grafica1) grafica1.destroy();
  if(grafica2) grafica2.destroy();

  // Gráfica población y superficie
  let ctx1 = document.getElementById("grafica");
  grafica1 = new Chart(ctx1,{
    type:"bar",
    data:{
      labels:["Población","Superficie km²"],
      datasets:[{
        label:nombre,
        data:[estado.poblacion,estado.superficie],
        backgroundColor:["#42a5f5","#66bb6a"]
      }]
    }
  });

  // Gráfica minerales
  let ctx2 = document.getElementById("graficaMineral");
  grafica2 = new Chart(ctx2,{
    type:"bar",
    data:{
      labels:["Petróleo","Oro","Plata","Cobre","Hierro"],
      datasets:[{
        label:"Minerales en "+nombre,
        data:[
          estado.mineral.petroleo,
          estado.mineral.oro,
          estado.mineral.plata,
          estado.mineral.cobre,
          estado.mineral.hierro
        ],
        backgroundColor:["#fdd835","#ff8f00","#c0ca33","#8d6e63","#607d8b"]
      }]
    }
  });
}
